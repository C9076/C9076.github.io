name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # repo ชื่อ <user>.github.io ใช้ base "/" ส่วน repo อื่นใช้ "/<ชื่อ repo>/"
      - name: Build
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO" == *.github.io ]]; then BASE="/"; else BASE="/$REPO/"; fi
          npx ng build --base-href "$BASE"
          cp dist/portfolio-ng/browser/index.html dist/portfolio-ng/browser/404.html
          touch dist/portfolio-ng/browser/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/portfolio-ng/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
